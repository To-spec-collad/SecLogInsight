name: Python dependency remediation benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dependency-remediation.yml"
      - "data/projects.csv"
      - "tools/remediatebench/**"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark scripts
        shell: bash
        run: python -m py_compile tools/remediatebench/run_project.py tools/remediatebench/aggregate.py
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import json
          from pathlib import Path
          rows = list(csv.DictReader(Path("data/projects.csv").open(encoding="utf-8")))
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          PY

  experiment:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Install benchmark tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run project experiment
        shell: bash
        run: |
          python tools/remediatebench/run_project.py \
            --slug "${{ matrix.slug }}" \
            --repo-url "${{ matrix.repo_url }}" \
            --ref "${{ matrix.ref }}"
      - name: Upload project artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.slug }}
          path: artifacts/${{ matrix.slug }}
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: artifacts
          merge-multiple: false
      - name: Aggregate results
        shell: bash
        run: python tools/remediatebench/aggregate.py --input artifacts --output results
      - name: Upload aggregate results
        uses: actions/upload-artifact@v4
        with:
          name: remediation-results
          path: results
      - name: Persist aggregate summary
        shell: bash
        run: |
          mkdir -p committed-results
          cp results/summary.json committed-results/summary.json
          cp results/summary.csv committed-results/summary.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add committed-results/summary.json committed-results/summary.csv
          git diff --cached --quiet || git commit -m "Record dependency remediation summary"
          git push
